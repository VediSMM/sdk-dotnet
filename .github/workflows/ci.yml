name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: .NET SDK ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: '8.0.x'
            sdk_directory: eng/dotnet8
          - dotnet: '10.0.x'
            sdk_directory: eng/dotnet10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: cp "${{ matrix.sdk_directory }}/global.json" global.json
      - run: dotnet --version
      - run: dotnet restore VediSMM.sln --locked-mode
      - run: php scripts/generate.php
      - run: dotnet format VediSMM.sln --no-restore
      - run: git diff --exit-code -- . ':(exclude)global.json'
      - run: dotnet build VediSMM.sln --configuration Release --no-restore
      - run: dotnet test VediSMM.sln --configuration Release --no-restore -- --minimum-expected-tests 15
      - run: git restore global.json
      - run: git diff --exit-code
      - run: php scripts/check_docs.php
      - run: php scripts/check_secrets.php

  quality:
    name: Coverage and consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: cp eng/dotnet10/global.json global.json
      - run: dotnet --version
      - run: dotnet restore VediSMM.sln --locked-mode
      - run: php scripts/generate.php
      - run: dotnet format VediSMM.sln --no-restore
      - run: git diff --exit-code -- . ':(exclude)global.json'
      - run: dotnet build VediSMM.sln --configuration Release --no-restore
      - run: dotnet test VediSMM.sln --configuration Release --no-restore -- --minimum-expected-tests 15 --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - run: php scripts/check_coverage.php TestResults/coverage.cobertura.xml
      - run: dotnet pack src/VediSMM/VediSMM.csproj --configuration Release --no-build --output artifacts
      - run: php scripts/check_artifact.php artifacts/VediSMM.0.1.0.nupkg artifacts/VediSMM.0.1.0.snupkg
      - run: dotnet restore examples/VediSMM.Quickstart/VediSMM.Quickstart.csproj --configfile examples/NuGet.Local.Config --force-evaluate
      - run: dotnet build examples/VediSMM.Quickstart/VediSMM.Quickstart.csproj --configuration Release --no-restore
      - run: git restore global.json
      - run: git diff --exit-code
      - run: php scripts/check_docs.php
      - run: php scripts/check_secrets.php
